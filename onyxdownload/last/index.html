<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download ONYX</title>
<meta name="description" content="Download the latest ONYX build for RobRun.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e3202d' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e3202d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12090a;
  --card: #1c0e10;
  --raised: #2a1417;
  --line: rgba(255, 214, 214, .08);
  --line-2: rgba(255, 214, 214, .15);
  --text: #f3ecec;
  --text-2: #bba6a8;
  --muted: #937c7f;
  --red: #e3202d;
  --red-press: #c81b27;
  --green: #3ddc84;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --sans: "Geist", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 400 15px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh;
}
a { color: inherit; text-decoration: none; }
::selection { background: var(--red); color: #fff; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }

/* background: red spot + night range grid, same as the main site */
.bg { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
.spot {
  position: absolute; width: 900px; height: 700px; left: 50%; top: -260px; transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(227,32,45,.32), rgba(227,32,45,.08) 55%, transparent);
}
.range {
  position: absolute; left: -10%; right: -10%; bottom: 0; height: 55%;
  perspective: 520px; perspective-origin: 50% 0%;
  -webkit-mask: linear-gradient(to bottom, transparent, #000 40%, #000 70%, transparent);
          mask: linear-gradient(to bottom, transparent, #000 40%, #000 70%, transparent);
}
.grid {
  position: absolute; inset: -100% 0 0 0;
  background-image:
    linear-gradient(rgba(255,90,100,.13) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,90,100,.13) 1px, transparent 1px);
  background-size: 64px 64px;
  transform: rotateX(68deg); transform-origin: 50% 100%;
  animation: advance 6s linear infinite;
}
@keyframes advance { to { background-position: 0 64px, 0 0; } }

/* top bar */
.bar {
  width: min(1200px, 100% - 32px); margin: 0 auto; height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; letter-spacing: .08em; }
.logo { width: 40px; height: auto; }
.bar-right { display: flex; align-items: center; gap: 12px; }
.back { color: var(--text-2); font-size: 14px; transition: color .15s var(--ease); }
.back:hover { color: var(--text); }
.lang { display: flex; padding: 2px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.lang button {
  width: 36px; height: 28px; border: 0; border-radius: 6px; background: none; cursor: pointer;
  color: var(--muted); font: 500 12px var(--mono);
  transition: color .15s var(--ease), background-color .15s var(--ease);
}
.lang button:hover { color: var(--text); }
.lang button[aria-pressed="true"] { color: var(--text); background: var(--raised); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }

/* card */
main { flex: 1; display: grid; place-items: center; padding: 32px 16px 64px; }
.card {
  position: relative; width: min(520px, 100%);
  background: linear-gradient(180deg, rgba(42,20,23,.85), rgba(28,14,16,.92));
  border: 1px solid var(--line-2); border-radius: 18px;
  padding: 40px 36px 32px; text-align: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 40px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.4);
  backdrop-filter: blur(10px);
  animation: enter .7s var(--ease) both;
}
.card::before {
  content: ""; position: absolute; left: 50%; top: -1px; width: 45%; height: 1px; transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, var(--red), transparent);
}
@keyframes enter { from { opacity: 0; transform: translateY(16px); } }

.mark { width: 96px; height: auto; margin: 0 auto 24px; display: block; filter: drop-shadow(0 8px 24px rgba(227,32,45,.35)); }
.reticle-spin { transform-origin: 64px 31px; animation: spin 10s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

h1 { font-size: clamp(28px, 6vw, 36px); font-weight: 500; letter-spacing: -.03em; line-height: 1.1; }
.sub { color: var(--text-2); margin-top: 10px; }

.meta {
  display: grid; grid-template-columns: repeat(3, 1fr); margin: 28px 0;
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.meta div { padding: 12px 8px; }
.meta div + div { border-left: 1px solid var(--line); }
.meta b { display: block; font: 500 14px var(--mono); }
.meta span { color: var(--muted); font-size: 12px; }

.btn {
  position: relative; overflow: hidden; width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 52px; padding: 0 20px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--red); color: #fff; font: 500 16px var(--sans);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 12px 32px -12px rgba(227,32,45,.8);
  transition: background-color .15s var(--ease), transform .12s var(--ease);
}
.btn::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
  transform: skewX(-20deg); transition: left .6s var(--ease);
}
.btn:hover::before { left: 130%; }
.btn:hover { background: var(--red-press); }
.btn:active { transform: scale(.98); }
.btn-ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s var(--ease); }
.btn:hover .btn-ico { transform: translateY(2px); }
.btn.done { background: #1f3a2a; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(61,220,132,.35); }
.btn.done::before { display: none; }

.status { min-height: 22px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.status a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

.steps { list-style: none; text-align: left; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; color: var(--text-2); font-size: 14px; }
.steps .n {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  font: 500 12px var(--mono); color: var(--text); background: var(--raised); border: 1px solid var(--line);
}
.steps b { color: var(--text); font-weight: 500; }
kbd, code {
  display: inline-block; font: 500 12px/20px var(--mono); padding: 0 6px; border-radius: 4px;
  background: var(--raised); border: 1px solid var(--line); color: var(--text);
  box-shadow: 0 1px 0 rgba(0,0,0,.6); white-space: nowrap; vertical-align: 1px;
}

footer { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 13px; }
footer a:hover { color: var(--text); }

@media (max-width: 480px) {
  .card { padding: 32px 20px 24px; }
  .back { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .grid, .reticle-spin, .card { animation: none; }
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="spot"></div>
  <div class="range"><div class="grid"></div></div>
</div>

<header class="bar">
  <a href="https://robrun.icu/" class="brand" aria-label="ONYX">
    <svg class="logo" viewBox="0 0 120 64" aria-hidden="true">
      <path d="M4 36 C 22 14, 62 6, 116 4 C 92 12, 84 20, 80 30 C 70 52, 40 60, 16 52 C 30 50, 44 44, 50 34 C 34 32, 18 34, 4 36 Z" fill="#ededed"/>
      <circle cx="64" cy="31" r="13" fill="none" stroke="#e3202d" stroke-width="4"/>
      <circle cx="64" cy="31" r="4.5" fill="#e3202d"/>
      <path d="M64 12v8M64 42v8M45 31h8M75 31h8" stroke="#e3202d" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span>ONYX</span>
  </a>
  <div class="bar-right">
    <a href="https://robrun.icu/" class="back" data-i18n="back">← robrun.icu</a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <svg class="mark" viewBox="0 0 120 64" aria-hidden="true">
      <path d="M4 36 C 22 14, 62 6, 116 4 C 92 12, 84 20, 80 30 C 70 52, 40 60, 16 52 C 30 50, 44 44, 50 34 C 34 32, 18 34, 4 36 Z" fill="#ededed"/>
      <g class="reticle-spin">
        <circle cx="64" cy="31" r="13" fill="none" stroke="#e3202d" stroke-width="4"/>
        <path d="M64 12v8M64 42v8M45 31h8M75 31h8" stroke="#e3202d" stroke-width="4" stroke-linecap="round"/>
      </g>
      <circle cx="64" cy="31" r="4.5" fill="#e3202d"/>
    </svg>

    <h1 data-i18n="title">Download ONYX</h1>
    <p class="sub" data-i18n="sub">Latest build for RobRun. Free.</p>

    <div class="meta">
      <div><b>Onyx.zip</b><span data-i18n="m.file">file</span></div>
      <div><b id="size">—</b><span data-i18n="m.size">size</span></div>
      <div><b>Win 10/11</b><span data-i18n="m.os">x64</span></div>
    </div>

    <a href="/files/Onyx.zip" download class="btn" id="dl">
      <svg viewBox="0 0 24 24" class="btn-ico" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span data-i18n="btn">Download</span>
    </a>
    <p class="status" id="status" aria-live="polite"></p>

    <ol class="steps">
      <li><span class="n">1</span><span data-i18n-html="s1">Unpack the archive and run <code>start.bat</code></span></li>
      <li><span class="n">2</span><span data-i18n-html="s2">Launch <b>RobRun</b> and join a match</span></li>
      <li><span class="n">3</span><span data-i18n-html="s3">Press <kbd>Insert</kbd> to open the menu</span></li>
    </ol>
  </section>
</main>

<footer>
  <a href="https://robrun.icu/">robrun.icu</a>
</footer>

<script>
  const T = {
    en: {
      _t: 'Download ONYX', back: '← robrun.icu', title: 'Download ONYX', sub: 'Latest build for RobRun. Free.',
      'm.file': 'file', 'm.size': 'size', 'm.os': 'x64', btn: 'Download',
      s1: 'Unpack the archive and run <code>start.bat</code>',
      s2: 'Launch <b>RobRun</b> and join a match',
      s3: 'Press <kbd>Insert</kbd> to open the menu',
      started: 'Download started. Didn’t start? <a href="/files/Onyx.zip" download>Try again</a>',
      doneBtn: 'Downloading…'
    },
    ru: {
      _t: 'Скачать ONYX', back: '← robrun.icu', title: 'Скачать ONYX', sub: 'Последняя версия для RobRun. Бесплатно.',
      'm.file': 'файл', 'm.size': 'размер', 'm.os': 'x64', btn: 'Скачать',
      s1: 'Распакуй архив и запусти <code>start.bat</code>',
      s2: 'Запусти <b>RobRun</b> и зайди в матч',
      s3: 'Нажми <kbd>Insert</kbd>, чтобы открыть меню',
      started: 'Загрузка началась. Не началась? <a href="/files/Onyx.zip" download>Скачать ещё раз</a>',
      doneBtn: 'Загрузка…'
    }
  };
  let lang = 'en';
  const setLang = l => {
    lang = T[l] ? l : 'en';
    const d = T[lang];
    document.documentElement.lang = lang;
    document.title = d._t;
    document.querySelectorAll('[data-i18n]').forEach(el => { if (d[el.dataset.i18n] != null) el.textContent = d[el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { if (d[el.dataset.i18nHtml] != null) el.innerHTML = d[el.dataset.i18nHtml]; });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    if (dl.classList.contains('done')) { dl.querySelector('span').textContent = d.doneBtn; status.innerHTML = d.started; }
    try { localStorage.setItem('onyx-lang', lang); } catch (e) {}
  };
  const dl = document.getElementById('dl');
  const status = document.getElementById('status');
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  let saved = null;
  try { saved = localStorage.getItem('onyx-lang'); } catch (e) {}
  const q = new URLSearchParams(location.search).get('lang');
  setLang(q || saved || ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en'));

  // after click: show a confirmation state, keep the link working
  dl.addEventListener('click', () => {
    dl.classList.add('done');
    dl.querySelector('span').textContent = T[lang].doneBtn;
    status.innerHTML = T[lang].started;
    setTimeout(() => { dl.classList.remove('done'); dl.querySelector('span').textContent = T[lang].btn; }, 4000);
  });

  // real file size from the server
  fetch('/files/Onyx.zip', { method: 'HEAD', cache: 'no-store' }).then(r => {
    const n = +r.headers.get('content-length');
    if (r.ok && n) document.getElementById('size').textContent = n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';
  }).catch(() => {});
</script>
</body>
</html>
